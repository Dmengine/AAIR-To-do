<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Task - Minimalist Productivity</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#4b4dd8",
                        "secondary-container": "#6cf8bb",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-fixed-variant": "#005236",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "primary": "#3525cd",
                        "on-tertiary-container": "#d9d8ff",
                        "outline-variant": "#c7c4d8",
                        "primary-container": "#4f46e5",
                        "outline": "#777587",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-tertiary-fixed": "#07006c",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#2f2ebe",
                        "on-surface": "#191c1e",
                        "background": "#f7f9fb",
                        "on-primary-container": "#dad7ff",
                        "secondary-fixed": "#6ffbbe",
                        "secondary-fixed-dim": "#4edea3",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e6e8ea",
                        "inverse-primary": "#c3c0ff",
                        "primary-fixed-dim": "#c3c0ff",
                        "tertiary-fixed": "#e1e0ff",
                        "surface-container": "#eceef0",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#c0c1ff",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-surface": "#2d3133",
                        "surface-dim": "#d8dadc",
                        "on-background": "#191c1e",
                        "on-secondary-container": "#00714d",
                        "surface-tint": "#4d44e3",
                        "on-surface-variant": "#464555",
                        "surface-variant": "#e0e3e5",
                        "tertiary": "#3130c0",
                        "inverse-on-surface": "#eff1f3",
                        "on-error": "#ffffff",
                        "secondary": "#006c49",
                        "surface-bright": "#f7f9fb",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed": "#002113",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#e2dfff",
                        "on-primary-fixed": "#0f0069"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card_padding": "16px",
                        "gutter": "12px",
                        "lg": "24px",
                        "md": "16px",
                        "sm": "8px",
                        "xl": "32px",
                        "page_margin": "20px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "task-completed": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "display": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "task-text": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "task-completed": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "task-text": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .voice-wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 24px;
        }
        .wave-bar {
            width: 3px;
            background-color: #3525cd;
            border-radius: 9999px;
            animation: wave-grow 1s ease-in-out infinite;
        }
        @keyframes wave-grow {
            0%, 100% { height: 4px; }
            50% { height: 20px; }
        }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        .fading-text {
            mask-image: linear-gradient(to right, black 70%, transparent 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top Navigation -->
<header class="bg-background w-full top-0 z-10 flex justify-between items-center px-page_margin py-md">
<div class="flex items-center gap-md">
<button aria-label="Cancel" class="hover:bg-surface-container-low transition-colors p-2 rounded-full active:opacity-80">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">New Task</h1>
</div>
<div class="flex items-center gap-md">
<button class="hover:bg-surface-container-low transition-colors p-2 rounded-full active:opacity-80">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</button>
</div>
</header>
<main class="flex-grow px-page_margin py-xl max-w-2xl mx-auto w-full">
<!-- Input Canvas -->
<div class="space-y-xl">
<!-- Title Section -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline uppercase" for="task-title">Task Title</label>
<input class="w-full bg-transparent border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-md font-headline-sm text-headline-sm transition-colors duration-200 outline-none" id="task-title" placeholder="What needs to be done?" type="text"/>
</div>
<!-- Voice Transcription (Visual Indicator) -->
<div class="bg-surface-container-low rounded-xl p-card_padding flex items-center gap-md border border-outline-variant/30 animate-pulse" id="voice-indicator">
<div class="voice-wave">
<div class="wave-bar"></div>
<div class="wave-bar"></div>
<div class="wave-bar"></div>
<div class="wave-bar"></div>
<div class="wave-bar"></div>
</div>
<div class="flex-grow overflow-hidden">
<p class="font-task-text text-task-text text-primary fading-text whitespace-nowrap">
                        "Remind me to review the quarterly budget..."
                    </p>
</div>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<!-- Description Section -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline uppercase" for="task-desc">Description (Optional)</label>
<textarea class="w-full bg-transparent border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-md font-body-md text-body-md transition-colors duration-200 outline-none resize-none" id="task-desc" placeholder="Add some details or context..." rows="4"></textarea>
</div>
<!-- Task Metadata (Bento-style attributes) -->
<div class="grid grid-cols-2 gap-md pt-lg">
<button class="flex items-center gap-sm p-card_padding bg-surface-container-lowest border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Due Date</span>
</button>
<button class="flex items-center gap-sm p-card_padding bg-surface-container-lowest border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">priority_high</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Priority</span>
</button>
</div>
</div>
</main>
<!-- Fixed Footer Actions -->
<footer class="p-page_margin space-y-md bg-background">
<button class="w-full py-md bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full shadow-lg hover:bg-primary-container transition-all active:scale-95 shadow-indigo-600/15">
            Save Task
        </button>
<button class="w-full py-md text-on-surface-variant font-body-md text-body-md rounded-full hover:bg-surface-container-low transition-colors active:opacity-80">
            Cancel
        </button>
</footer>
<!-- Atmosphere/Decorative Element (Minimalist Shader Placeholder) -->
<div class="fixed inset-0 -z-10 opacity-30 pointer-events-none">

</div>
<!-- Micro-interaction Script -->
<script>
        // Simple focus animation for inputs
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.remove('text-outline');
                input.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary');
                input.parentElement.querySelector('label').classList.add('text-outline');
            });
        });

        // Simulating transcription clearing when typing starts
        const titleInput = document.getElementById('task-title');
        const voiceIndicator = document.getElementById('voice-indicator');
        
        titleInput.addEventListener('input', (e) => {
            if (e.target.value.length > 0) {
                voiceIndicator.classList.add('opacity-30');
            } else {
                voiceIndicator.classList.remove('opacity-30');
            }
        });
    </script>
</body></html>
